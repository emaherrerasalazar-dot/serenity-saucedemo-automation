webdriver {
    driver = "chrome"
    autodownload = false
    chrome.driver = "drivers/chromedriver.exe"

    capabilities {
        "goog:chromeOptions" {
            args = [
                "--incognito",
                "--disable-notifications",
                "--no-first-run"
            ]
        }
    }
}

serenity {
    browser = "chrome"
    take.screenshots = AFTER_EACH_STEP
}

headless.mode = false

webdriver.base.url = "https://www.saucedemo.com/"